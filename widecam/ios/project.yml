name: WideCam
options:
  bundleIdPrefix: com.pxshaa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: S3QT58BTJT
    CODE_SIGN_STYLE: Automatic
targets:
  WideCam:
    type: application
    platform: iOS
    sources:
      - path: WideCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pxshaa.widecam
        INFOPLIST_FILE: WideCam/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
schemes:
  WideCam:
    build:
      targets:
        WideCam: all
    run:
      config: Debug
    archive:
      config: Release
